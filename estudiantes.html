<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estudiantes · ThesisVista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <div id="sidebar-placeholder"></div>
  <main>
    <div class="page-head">
      <div>
        <h1>Estudiantes</h1>
        <p>Inscribe estudiantes a las materias que van a cursar.</p>
      </div>
    </div>

    <div id="flash" class="flash"></div>

    <div class="panel">
      <h2>Nueva inscripción</h2>
      <form class="inline-form" id="form-inscripcion">
        <div class="field">
          <label for="id_estudiante">Estudiante</label>
          <select id="id_estudiante" name="id_estudiante" required>
            <option value="">Selecciona...</option>
          </select>
        </div>
        <div class="field">
          <label for="id_materia">Materia</label>
          <select id="id_materia" name="id_materia" required>
            <option value="">Selecciona...</option>
          </select>
        </div>
        <button type="submit">Inscribir</button>
      </form>
    </div>

    <div class="panel">
      <h2>Inscripciones actuales (<span id="total-inscripciones">0</span>)</h2>
      <table>
        <thead>
          <tr><th>Estudiante</th><th>Materia</th><th></th></tr>
        </thead>
        <tbody id="tbody-inscripciones">
          <tr><td colspan="3" style="color:var(--text-muted);">Cargando…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
<script src="js/common.js"></script>
<script src="js/estudiantes.js"></script>
</body>
</html>
